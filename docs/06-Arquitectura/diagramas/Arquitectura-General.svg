<svg xmlns="http://www.w3.org/2000/svg" width="840" height="900" viewBox="0 0 840 900" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura local — Control de Actividades</title>
  <desc id="description">Next.js entrega la aplicación. La arquitectura prevista sitúa la presentación con React y Tailwind, las reglas con TypeScript y localStorage en el navegador. HU-01 implementa la consulta y lectura validada; HU-02 el registro y guardado coordinado mediante Web Locks. Los movimientos y su coordinación entre pestañas siguen pendientes. No hay sincronización, respaldos ni restauración. Si se borran los datos locales, las tareas se pierden para la aplicación.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="840" height="900" fill="#fff"/>
  <rect x="180" y="90" width="480" height="90" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="80" y="245" width="680" height="480" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <g fill="#e8edf2" stroke="#334155" stroke-width="1.5">
    <rect x="150" y="310" width="540" height="90" rx="6"/>
    <rect x="150" y="450" width="540" height="95" rx="6"/>
    <rect x="150" y="595" width="540" height="95" rx="6"/>
  </g>
  <g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <path d="M420 180V245"/>
    <path d="M420 400V450"/>
    <path d="M420 545V595"/>
  </g>
  <g fill="#17212e" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="420" y="45" font-size="24" font-weight="bold">Control de Actividades · Arquitectura local</text>
    <g font-size="20" font-weight="bold">
      <text x="420" y="126">Next.js 16 · App Router</text>
      <text x="420" y="282">Navegador del usuario</text>
      <text x="420" y="345">Presentación · React 19 y Tailwind CSS 4</text>
      <text x="420" y="486">Aplicación · TypeScript</text>
      <text x="420" y="631">Persistencia · localStorage</text>
    </g>
    <g font-size="16">
      <text x="420" y="155">Entrega de páginas, componentes y recursos</text>
      <text x="420" y="375">Tablero, acciones y mensajes de resultado</text>
      <text x="420" y="517">Validaciones, transiciones y coordinación entre pestañas</text>
      <text x="420" y="662">Todas las tareas, incluidas las completadas</text>
      <text x="420" y="803">Sin sincronización, respaldos ni restauración.</text>
      <text x="420" y="838">Si se borran los datos del navegador, las tareas se pierden.</text>
    </g>
    <text x="420" y="770" font-size="19" font-weight="bold">localStorage desde el inicio del desarrollo</text>
    <text x="420" y="875" font-size="14">Consulta y registro implementados. Movimientos pendientes.</text>
    <text x="435" y="218" fill="#475569" font-size="14" text-anchor="start">entrega</text>
  </g>
</svg>
